  <line x1="12" y1="2" x2="12" y2="6" stroke="#1E2544" stroke-width="2.6" stroke-linecap="round" />
  <line x1="12" y1="18" x2="12" y2="22" stroke="#1E2544" stroke-width="2.6" stroke-linecap="round" />
  <line x1="2" y1="12" x2="6" y2="12" stroke="#1E2544" stroke-width="2.6" stroke-linecap="round" />
  <line x1="18" y1="12" x2="22" y2="12" stroke="#1E2544" stroke-width="2.6" stroke-linecap="round" />
  <circle cx="12" cy="12" r="2.2" fill="#1E2544" stroke="#1E2544" stroke-width="1.2" />

  <!-- Crisp foreground reticle in Brand Pale Cyan & Coral -->
