  <line x1="18" y1="12" x2="21" y2="12" stroke="#D2FDFF" stroke-width="1.2" stroke-linecap="round" />

  <!-- Precision pinpoint center -->
  <circle cx="12" cy="12" r="1.6" fill="#FFFFFF" />
  <circle cx="12" cy="12" r="0.8" fill="#F4976C" />
</svg>
