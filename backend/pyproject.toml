[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "ovael-backend"
version = "5.0.0"
description = "OVAEL deterministic Decision Kernel backend with hard per-turn semantic budgets and bounded AI escalation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10,<13",
  "argon2-cffi>=23,<26",
  "PyJWT>=2.8,<3",
  "pypdf>=5,<7",
  "pypdfium2>=4,<6",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "matplotlib>=3.9,<4",
  "mcp>=2,<3",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<1"]
local-model = [
  "torch>=2.4",
  "transformers>=4.50",
]
test = ["pytest>=8,<10"]
lint = ["ruff==0.17.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# Existing code violates these rules. They are ignored so the baseline is
# green without touching source files; revisit and tighten over time.
ignore = [
  "E701",  # multiple statements on one line (colon)
  "E702",  # multiple statements on one line (semicolon)
  "E402",  # module-level import not at top of file
  "E731",  # lambda assignment
  "E741",  # ambiguous variable name
  "F401",  # unused import
  "F841",  # unused variable
  "F821",  # retrieval.py:266 uses Any only in a local annotation (never evaluated)
  "B007",  # unused loop control variable
  "B008",  # function call in default argument (FastAPI Depends)
  "B023",  # closure over loop variable (api_v1.py:1629, proof_learning.py:391,396)
  "B904",  # raise without from inside except (api_v1.py:1215)
]
